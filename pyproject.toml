[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hongkong_holiday"
version = "1.0.0"
description = "Hong Kong public holidays from GovHK open data, with algorithmic fallback for historical and far-future years."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "FUNG", email = "funglkf00@gmail.com" },
]
keywords = ["hong kong", "holidays", "public holidays", "govhk", "1823", "calendar"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "holidays>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/funglkfcc/hongkong_holiday"
"Data Source" = "https://data.gov.hk/en-data/dataset/hk-effo-statistic-cal"

[tool.hatch.build.targets.wheel]
packages = ["src/hongkong_holiday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
